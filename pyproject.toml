[project]
name = "network_events"
version = "0.2.0"
description = "Audit canonical r01network behavioral/BOLD identities and generate BIDS events with timing evidence."
readme = "README.md"
requires-python = ">=3.11"
# nibabel reads acquired BOLD duration from the NIfTI image.
dependencies = ["numpy", "pandas", "nibabel"]

[project.scripts]
network-events = "network_events.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_events"]

[tool.pytest.ini_options]
testpaths = ["tests"]
